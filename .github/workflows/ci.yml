name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }

jobs:
  api:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_PASSWORD: devonly, POSTGRES_DB: fav }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      ADMIN_DATABASE_URL: postgres://postgres:devonly@localhost:5432/fav
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24.15.0, cache: npm, cache-dependency-path: api/package-lock.json }
      - run: npm ci
        working-directory: api
      - name: Análise estática (tsc estrito)
        run: npm run lint
        working-directory: api
      - name: Build
        run: npm run build
        working-directory: api
      - name: Testes de integração (PostgreSQL 18 real, cenários A01–A10)
        run: npm test
        working-directory: api
      - name: Verificação de migrações (aplicar duas vezes; checksum)
        working-directory: api
        run: |
          FAV_PROFILE=test node dist/db/cli.js setup
          MIGRATION_DATABASE_URL=postgres://fav_migrator:devonly@localhost:5432/fav FAV_PROFILE=test node dist/db/cli.js migrate | tee out.txt
          grep -q "migrações aplicadas: nenhuma" out.txt

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24.15.0, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web

  imagem:
    runs-on: ubuntu-24.04
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem OCI
        run: docker build -f Containerfile -t fav-digital:ci .
      - name: Varredura de vulnerabilidades (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with: { image-ref: "fav-digital:ci", severity: "CRITICAL,HIGH", ignore-unfixed: true, exit-code: "1" }

  manifests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: kustomize build + kubeconform
        run: |
          curl -sSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz | tar xz
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          for o in deploy/k8s/base deploy/k8s/overlays/homologacao; do ./kustomize build $o | ./kubeconform -strict -summary -; done
          ./kustomize build deploy/k8s/overlays/openshift | ./kubeconform -summary -ignore-missing-schemas -
