# Migração em etapa explícita, com papel dedicado (fav_migrator). Advisory lock impede execução concorrente.
apiVersion: batch/v1
kind: Job
metadata: { name: fav-digital-migrate }
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata: { labels: { app.kubernetes.io/component: migrate } }
    spec:
      restartPolicy: Never
      serviceAccountName: fav-digital
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: migrate
          image: fav-digital
          command: ["node", "dist/db/cli.js", "migrate"]
          env:
            - { name: FAV_PROFILE, value: homologacao }
            - { name: AUTH_PROVIDER, value: kerberos-ldap }
            - { name: SESSION_COOKIE_SECURE, value: "true" }
            - name: MIGRATION_DATABASE_URL
              valueFrom: { secretKeyRef: { name: fav-digital-db, key: migration-url } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: { medium: Memory, sizeLimit: 16Mi } }]
