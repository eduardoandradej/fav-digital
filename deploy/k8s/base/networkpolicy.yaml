# Somente os fluxos necessários: entrada do Ingress/Router; saída para DNS, KDC/DC, banco.
# Ajuste os seletores/CIDRs no overlay do ambiente (valores institucionais não ficam no repositório).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: fav-digital }
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } }
        - namespaceSelector: { matchLabels: { network.openshift.io/policy-group: ingress } }
      ports: [{ port: 8080 }]
  egress:
    - to: [{ namespaceSelector: {} }]
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
    - to: [{ ipBlock: { cidr: 192.0.2.0/24 } }]     # TEST-NET: substituir pelo(s) KDC/DC aprovados
      ports: [{ port: 88, protocol: TCP }, { port: 88, protocol: UDP }, { port: 389, protocol: TCP }]
    - to: [{ ipBlock: { cidr: 198.51.100.0/24 } }]  # TEST-NET: substituir pelo PostgreSQL provisionado
      ports: [{ port: 5432, protocol: TCP }]
