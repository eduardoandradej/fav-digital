apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fav-digital-homolog
resources:
  - ../../base
  - ingress.yaml
  - secret-refs.yaml
patches:
  - target: { kind: Deployment, name: fav-digital }
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - { name: SESSION_COOKIE_SECURE, value: "true" }
