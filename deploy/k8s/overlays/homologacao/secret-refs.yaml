# Este arquivo documenta os segredos esperados; os VALORES são criados pela infraestrutura (Vault/External Secrets/SealedSecrets).
#   fav-digital-db:      database-url (papel fav_app), migration-url (papel fav_migrator)
#   fav-digital-keytab:  sync.keytab (identidade técnica de leitura, menor privilégio)
#   fav-digital-tls:     certificado do Ingress
apiVersion: v1
kind: ConfigMap
metadata: { name: fav-digital-segredos-esperados }
data:
  segredos: "fav-digital-db, fav-digital-keytab, fav-digital-tls"
